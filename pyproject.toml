[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Function calling with constrained decoding using a small language model."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pydantic",
    "llm-sdk",
]

[dependency-groups]
dev = [
    "flake8",
    "mypy",
]

[tool.uv.sources]
llm-sdk = { path = "llm_sdk" }

[tool.mypy]
mypy_path = "llm_sdk"
exclude = ["(?x)(^llm_sdk/)"]

[[tool.mypy.overrides]]
module = [
    "llm_sdk",
    "llm_sdk.*",
]
follow_imports = "silent"